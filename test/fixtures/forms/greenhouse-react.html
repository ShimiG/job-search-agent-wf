<!doctype html><html><head><meta charset="utf-8"><title>Apply – Acme</title>
<style>
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .requiredInput { opacity: 0; width: 140px; height: 20px; position: absolute; }
  [role=listbox] { border: 1px solid #ccc; }
  [role=option] { padding: 4px; cursor: pointer; }
</style></head><body>
<!-- Mirrors the 2026 Greenhouse job-boards form: react-select comboboxes with async suggestions and
     invisible required inputs, a phone country picker, and two upload buttons both labelled "Attach".
     Enter in any text box submits the form, like the real thing. -->
<h1>Agent Platform Engineer</h1>
<form id="application-form" onsubmit="return go(event)">
  <div><label for="first_name">First Name<span>*</span></label><input id="first_name" name="first_name"></div>
  <div><label for="last_name">Last Name<span>*</span></label><input id="last_name" name="last_name"></div>
  <div><label for="email">Email<span>*</span></label><input id="email" name="email"></div>

  <div class="select-shell"><label id="country-label" for="country">Country<span>*</span></label>
    <input id="country" role="combobox" aria-labelledby="country-label" autocomplete="off">
    <div aria-hidden="true"><input class="requiredInput" tabindex="-1" required name="country_required"></div></div>
  <div><label for="phone">Phone<span>*</span></label><input id="phone" type="tel" name="phone"></div>

  <div class="select-shell"><label id="loc-label" for="candidate-location">Location (City)<span>*</span></label>
    <input id="candidate-location" role="combobox" aria-labelledby="loc-label" autocomplete="off">
    <div aria-hidden="true"><input class="requiredInput" tabindex="-1" required name="location_required"></div></div>

  <div><div>Resume/CV</div><button type="button">Attach</button>
    <label class="visually-hidden" for="resume">Attach</label><input id="resume" class="visually-hidden" type="file" name="resume"></div>
  <div><div>Cover Letter</div><button type="button">Attach</button>
    <label class="visually-hidden" for="cover_letter">Attach</label><input id="cover_letter" class="visually-hidden" type="file" name="cover_letter"></div>

  <button type="submit">Submit application</button>
</form>
<script>
const LISTS = {
  'country': ['Italy +39', 'Israel +972', 'United States +1'],
  'candidate-location': new URLSearchParams(location.search).has('nocity')
    ? ['Holonga, Tongatapu, Tonga']
    : ['Holonga, Tongatapu, Tonga', 'Holon, Tel Aviv, Israel', 'Holong Pather, Assam, India'],
};
const picked = {};
for (const id of Object.keys(LISTS)) {
  const input = document.getElementById(id);
  let timer;
  input.addEventListener('input', () => {
    clearTimeout(timer);
    document.querySelectorAll('[role=listbox]').forEach((l) => l.remove());
    const q = input.value.toLowerCase();
    if (!q) return;
    timer = setTimeout(() => {
      const list = document.createElement('div');
      list.setAttribute('role', 'listbox');
      for (const text of LISTS[id].filter((t) => t.toLowerCase().includes(q))) {
        const o = document.createElement('div');
        o.setAttribute('role', 'option');
        o.textContent = text;
        o.addEventListener('click', () => {
          picked[id] = text;
          input.value = text;
          input.closest('.select-shell').querySelector('.requiredInput').value = text;
          list.remove();
        });
        list.appendChild(o);
      }
      input.parentElement.appendChild(list);
    }, 400);
  });
}
async function go(e) {
  e.preventDefault();
  const f = document.getElementById('application-form');
  const data = { country: picked['country'] || '', location: picked['candidate-location'] || '' };
  for (const el of f.elements) if (el.name && !el.name.endsWith('_required')) data[el.name] = el.type === 'file' ? (el.files[0] && el.files[0].name) : el.value;
  await fetch('/submit', { method: 'POST', body: JSON.stringify(data) });
  history.pushState({}, '', '/confirmation');
  document.body.innerHTML = '<h1>Thank you for applying!</h1>';
  return false;
}
</script></body></html>
